name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  guard:
    name: Convenções
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nome do branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          padrao='^(feat|fix|chore|docs|test|refactor|ci|spike)/US[0-9]{2}-[a-z0-9-]+$'
          if ! printf '%s' "$BRANCH" | grep -Eq "$padrao"; then
            echo "::error::Branch '$BRANCH' fora da convenção."
            echo "Use <tipo>/US<NN>-<descricao>, por exemplo feat/US06-lancar-acao."
            echo "Tipos válidos: feat, fix, chore, docs, test, refactor, ci, spike."
            exit 1
          fi

      - name: Título do pull request
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|chore|docs|test|refactor|ci|perf|style)(\((api|web|db|contracts|ci|docs)\))?: .+'
          if ! printf '%s' "$TITULO" | grep -Eq "$padrao"; then
            echo "::error::Título fora do padrão de Conventional Commits."
            echo "O título vira a mensagem do commit no squash merge."
            echo "Exemplo: feat(api): registra auditoria ao recusar lançamento"
            exit 1
          fi

      - name: Referência à história
        env:
          TITULO: ${{ github.event.pull_request.title }}
          CORPO: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s %s %s' "$BRANCH" "$TITULO" "$CORPO" | grep -Eq 'US[0-9]{2}'; then
            echo "::error::Nenhuma história referenciada."
            echo "Cite a história no corpo do PR com 'Refs: USNN'."
            exit 1
          fi

      - name: Autoria dos commits
        run: |
          faixa="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git log "$faixa" --format='%B' | grep -Eiq 'co-authored-by:.*(claude|copilot|gpt|anthropic|openai)|generated with .*claude'; then
            echo "::error::Há menção de autoria de IA no histórico deste branch."
            echo "A autoria do trabalho é das pessoas do squad. Reescreva com git rebase -i."
            exit 1
          fi

      - name: Segredos no diff
        run: |
          faixa="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git diff "$faixa" -- . ':(exclude).github/workflows' \
            | grep -E '^\+' \
            | grep -Eiq '(postgres(ql)?://[^[:space:]]*:[^[:space:]]*@|aws_secret_access_key|-----BEGIN [A-Z ]*PRIVATE KEY-----)'; then
            echo "::error::O diff parece conter credencial. Use variável de ambiente."
            exit 1
          fi

      - name: Tamanho do pull request
        run: |
          faixa="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          linhas=$(git diff --numstat "$faixa" \
            -- . ':(exclude)package-lock.json' ':(exclude)**/*.png' ':(exclude)**/*.svg' \
            | awk '{ s += $1 + $2 } END { print s + 0 }')
          echo "Linhas úteis alteradas: $linhas"
          if [ "$linhas" -gt 400 ]; then
            echo "::warning::$linhas linhas úteis, acima do limite de 400 combinado no CONTRIBUTING."
            echo "Explique no PR por que não dá para quebrar em dois."
          fi

  changes:
    name: Áreas afetadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      web: ${{ steps.filtro.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          # Em push na main nada é filtrado: a main roda a suíte inteira, como rede
          # de segurança do trunk.
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package-lock.json'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package-lock.json'
              - '.github/workflows/**'

  qualidade:
    name: Lint, formatação e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  teste-web:
    name: Testes do front
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -w @gincana/web
      - run: npm run build -w @gincana/web

  teste-api:
    name: Testes da API
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gincana
          POSTGRES_PASSWORD: gincana
          POSTGRES_DB: gincana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gincana -d gincana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gincana:gincana@localhost:5432/gincana_test
      # Valor de teste, sem relação com nenhum ambiente real.
      JWT_SECRET: segredo-de-integracao-continua-com-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -w @gincana/scoring
      - run: npm run test -w @gincana/api
