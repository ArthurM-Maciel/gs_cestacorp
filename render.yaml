# Infraestrutura da API e do banco em homologação, no plano gratuito do Render.
#
# Este arquivo descreve o serviço; conectar a conta e autorizar o repositório é um passo
# manual, feito uma vez por quem administra o projeto. Nenhum segredo vive aqui: os
# valores marcados com sync:false são preenchidos no painel.
services:
  - type: web
    name: gincana-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run db:generate -w @gincana/api
    startCommand: npm run start -w @gincana/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gincana-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: gincana-db
    plan: free
    databaseName: gincana
    user: gincana
