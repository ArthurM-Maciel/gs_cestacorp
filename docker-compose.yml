# Banco de desenvolvimento. Sobe só o PostgreSQL: a API e o front rodam na máquina,
# com recarregamento automático.
#
#   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: gincana-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gincana
      POSTGRES_PASSWORD: gincana
      POSTGRES_DB: gincana
    ports:
      - '5432:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gincana -d gincana']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-postgres:
